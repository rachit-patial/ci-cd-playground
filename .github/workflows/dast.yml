name: DAST testing

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  dast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Pull image
        run: |
          docker pull ghcr.io/${{ github.repository }}::latest
      
      - name: Run Container
        run: |
          docker run -d \
            --name ci-cd-playground \
            -p 8080:8080 \
            ghcr.io/${{ github.repository }}:latest

      - name: Show logs
        run: docker logs ci-cd-playground

      - name: Wait for app
        run: |
          timeout 60 bash -c '
            until curl -fs http://localhost:8080; do
              sleep 2
            done
          '
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
      
      - name: Cleanup
        if: always()
        run: |
          docker stop ci-cd-playground || true
          docker rm ci-cd-playground || true